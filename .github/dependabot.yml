version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The types describe the Node.js major in .nvmrc; a newer major types APIs
      # the bot does not have at runtime. Raise both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1 for now.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
